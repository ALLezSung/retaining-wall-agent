# 复制为 config.toml 后修改。config.toml 已被 Git 忽略。
# 优先级：环境变量 > config.toml > 内置默认值。修改后重启应用。

[llm]
api_key = ""                            # 或使用 DEEPSEEK_API_KEY
model = "deepseek-flash"                 # DEEPSEEK_MODEL
base_url = "https://api.deepseek.com"     # DEEPSEEK_BASE_URL；可含 /v1，不含 /chat/completions
timeout_seconds = 45                     # DEEPSEEK_TIMEOUT_SECONDS
max_tokens = 1200                        # DEEPSEEK_MAX_TOKENS

[agent]
max_rounds = 6                           # AGENT_MAX_ROUNDS；带工具的模型请求轮数上限

[storage]
cases_database = "data/cases.sqlite3"     # CASES_DATABASE；相对路径以 work/ 为基准
